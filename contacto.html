<meta name="description" content="Cotiza tu proyecto de arquitectura, permiso o regularización con Vano Arquitectura en Talca.">

<meta property="og:title" content="Contacto y cotización — Vano Arquitectura">
<meta property="og:description" content="Cotiza tu proyecto de arquitectura, permiso o regularización con Vano Arquitectura en Talca.">
<meta property="og:image" content="https://vanoarqcl-arq.github.io/vano-arquitectura/img/casa-haras/01.jpg">
<meta property="og:url" content="https://vanoarqcl-arq.github.io/vano-arquitectura/contacto.html">

<body data-page="contacto">
<header id="site-header"></header>
<main>
<div class="wrap"><div class="page-title"><p class="eyebrow">Hablemos</p><h1>Contacto</h1></div>
<div class="two"><div id="cotiza"><h2>Cotiza tu proyecto</h2><p class="intro" style="margin-bottom:24px">Cuéntanos qué necesitas y te respondemos por el medio que prefieras.</p>
 <form id="cotiza-form" class="form">
  <label>Nombre<input name="nombre" required autocomplete="name"></label>
  <label>Teléfono<input name="telefono" type="tel" autocomplete="tel"></label>
  <label>Servicio<select name="servicio"><option>Diseño de arquitectura</option><option>Permiso de edificación</option><option>Regularización (Ley del Mono)</option><option>Modelación BIM</option><option>Renderizado</option><option>Dron o impresión 3D</option><option>Otro</option></select></label>
  <label>Ubicación del terreno o vivienda<input name="lugar" placeholder="Comuna, sector"></label>
  <label>Mensaje<textarea name="mensaje" rows="5" required></textarea></label>
  <label>Si prefieres WhatsApp, escribir a<select id="wanum"></select></label>
  <div class="botones"><button type="button" class="btn" id="enviar-mail">Enviar por correo</button><button type="button" class="btn ghost" id="enviar-wa">Enviar por WhatsApp</button></div>
  <p class="note">El mensaje se abre en tu correo o en WhatsApp, listo para enviar.</p>
 </form></div>
<div><div class="big-links" id="contacto-datos"></div><p class="note" style="margin-top:20px">Oficina en Talca, Región del Maule. Atendemos proyectos en toda la región.</p></div></div></div>
<div style="height:80px"></div>
</main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
